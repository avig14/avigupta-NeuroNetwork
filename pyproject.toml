[project]
name = "arg-gate"
version = "0.1.0"
description = "Agent Release Gate: a CI/CD release gate for action-taking AI agents. Grades what the agent did to the data, not what it said."
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.2.1",
    "langgraph==1.2.22",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
arg-gate = "arg_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arg_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
